<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGT HUB | VÉRIFICATION</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.2.umd.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #f1f5f9; --success: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .card { background: var(--card); padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        input { width: 100%; padding: 14px; margin: 15px 0; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; background: var(--accent); color: white; }
        #result { display: none; margin-top: 20px; text-align: left; background: #0f172a; padding: 15px; border-radius: 12px; border: 1px solid var(--success); }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: var(--accent);">LGT HUB</h2>
    <p style="color: #94a3b8;">Certification Blockchain</p>
    <input type="text" id="matInput" placeholder="Matricule (ex: ISC-2026-001)">
    <button class="btn" id="checkBtn" onclick="verifier()">RECHERCHER</button>

    <div id="result">
        <p style="color: var(--success); font-weight: bold; margin: 0;">✅ DOSSIER TROUVÉ</p>
        <p id="resHash" style="font-size: 0.7rem; word-break: break-all; color: #60a5fa;"></p>
        <button class="btn" style="background: var(--success); margin-top: 10px;" onclick="window.open('Dossier_Etudiant.pdf')">OUVRIR LE PDF</button>
    </div>
</div>

<script>
    async function verifier() {
        const mat = document.getElementById('matInput').value.trim();
        const btn = document.getElementById('checkBtn');
        const addr = "0xF031D80aB69cdDaAFD7cb6Ac53e35164c70D18ce";
        const abi = [{"inputs":[{"internalType":"string","name":"_matricule","type":"string"}],"name":"verifierDiplome","outputs":[{"internalType":"string","name":"","type":"string"},{"internalType":"uint256","name":"","type":"uint256"},{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"}];

        if(!mat) return alert("Matricule vide");

        try {
            btn.innerText = "CONNEXION...";
            btn.disabled = true;

            // LIEN SECOURS 1 : CLOUDFLARE (Très rapide et rarement bloqué)
            const provider = new ethers.providers.JsonRpcProvider("https://ethereum-sepolia-rpc.publicnode.com");
            const contract = new ethers.Contract(addr, abi, provider);
            
            const res = await contract.verifierDiplome(mat);
            
            if (res[2]) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('resHash').innerText = "Hash: " + res[0];
                btn.innerText = "TROUVÉ";
            } else {
                alert("Dossier inconnu dans la blockchain.");
                btn.disabled = false;
                btn.innerText = "RECHERCHER";
            }
        } catch (e) {
            alert("Problème réseau. Essaye avec ton téléphone en 4G (sans Wi-Fi).");
            console.error(e);
            btn.disabled = false;
            btn.innerText = "RECHERCHER";
        }
    }
</script>
</body>
</html>
