<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGT HUB ISC | Console d'Administration Blockchain</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --glass-left: rgba(0, 123, 255, 0.15); /* Bleu transparent flouté */
            --glass-right: rgba(106, 17, 203, 0.15); /* Violet transparent flouté */
            --glass-center: rgba(255, 255, 255, 0.07);
            --accent-orange: #ff7a00;
            --text-white: #ffffff;
            --danger: #ff4d4d;
            --success: #00ff88;
        }

        /* Thème Clair */
        body.light-mode {
            --glass-left: rgba(255, 255, 255, 0.6);
            --glass-right: rgba(255, 255, 255, 0.6);
            --glass-center: rgba(255, 255, 255, 0.8);
            --text-white: #1e1e1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: 0.3s ease; }

        body {
            background: url('img/fond.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-white);
            height: 100vh;
            display: grid;
            grid-template-columns: 280px 1fr 300px;
            overflow: hidden;
        }

        .glass { backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }

        /* --- COLONNE GAUCHE --- */
        .sidebar-left { background: var(--glass-left); padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .logo-header { display: flex; align-items: center; gap: 10px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-header img { height: 45px; }
        
        .btn-menu {
            width: 100%; padding: 12px; border-radius: 12px; border: none; background: rgba(255,255,255,0.1);
            color: var(--text-white); text-align: left; cursor: pointer; font-weight: 700; font-size: 13px;
            display: flex; align-items: center; gap: 10px; text-transform: uppercase;
        }
        .btn-menu:hover, .btn-menu.active { background: var(--accent-orange); box-shadow: 0 4px 15px rgba(255, 122, 0, 0.4); }

        /* Scanner Caméra */
        #scanner-box { display: none; background: #000; border-radius: 10px; overflow: hidden; margin-top: 10px; border: 2px solid var(--accent-orange); }

        /* --- COLONNE CENTRALE --- */
        .main-content { padding: 25px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .center-logo { margin-bottom: 15px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
        
        /* Compteurs */
        .faculty-counters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 850px; margin-bottom: 20px; }
        .count-card { padding: 15px; border-radius: 15px; text-align: center; background: var(--glass-center); border: 1px solid rgba(255,255,255,0.1); }
        .count-card h3 { font-size: 24px; color: var(--accent-orange); }
        .count-card p { font-size: 11px; font-weight: bold; opacity: 0.8; margin-top: 5px; text-transform: uppercase; }

        /* Formulaire */
        .scellage-form { width: 100%; max-width: 850px; padding: 25px; border-radius: 20px; background: var(--glass-center); }
        .form-title { text-align: center; margin-bottom: 20px; font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 0 0 10px rgba(0,0,0,0.5); }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
        label { font-size: 10px; font-weight: 900; color: var(--accent-orange); text-transform: uppercase; }
        input, select { 
            padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.4); color: white; outline: none; font-weight: 600;
        }

        .btn-anchor {
            width: 100%; padding: 15px; background: var(--accent-orange); border: none;
            border-radius: 12px; color: white; font-weight: 900; cursor: pointer;
            text-transform: uppercase; margin-top: 15px; letter-spacing: 1px;
        }

        /* --- COLONNE DROITE --- */
        .sidebar-right { background: var(--glass-right); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        
        /* Avatar Profil */
        .admin-profile { text-align: center; padding: 20px; border-radius: 20px; background: rgba(0,0,0,0.2); }
        .avatar-upload {
            width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--accent-orange);
            margin: 0 auto 15px; position: relative; overflow: hidden; cursor: pointer;
        }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload .hint {
            position: absolute; bottom: 0; background: rgba(0,0,0,0.6); width: 100%; 
            font-size: 9px; padding: 4px; color: #fff; font-weight: bold;
        }

        .meta-card { padding: 15px; border-radius: 15px; background: rgba(0,0,0,0.5); border-left: 4px solid #f6851b; }
        .clock { margin-top: auto; text-align: center; font-family: 'Courier New', Courier, monospace; font-size: 20px; color: var(--accent-orange); padding: 15px; border-radius: 12px; background: rgba(0,0,0,0.3); }

        #qr-code-final { margin-top: 20px; text-align: center; }
        #canvas-qr { background: white; padding: 8px; border-radius: 8px; display: inline-block; }
    </style>
</head>
<body>

    <div class="sidebar-left glass">
        <div class="logo-header">
            <img src="img/logo-isc.png" alt="ISC Logo">
            <span style="font-weight: 900; font-size: 14px;">LGT HUB ISC</span>
        </div>
        <button class="btn-menu active"><i class="fas fa-plus-circle"></i> Nouveau Scellage</button>
        <button class="btn-menu"><i class="fas fa-database"></i> Registre Global</button>
        <button class="btn-menu" onclick="window.open('verification.html')"><i class="fas fa-external-link-alt"></i> Vérification Publique</button>
        <button class="btn-menu" onclick="toggleTheme()"><i class="fas fa-adjust"></i> Mode Clair/Sombre</button>
        
        <div style="margin-top: 10px;">
            <label>Scanner QR Matricule</label>
            <button class="btn-menu" id="cam-toggle" onclick="toggleCamera()" style="background: #111; margin-top:5px;">
                <i class="fas fa-camera"></i> Allumer/Éteindre Cam
            </button>
            <div id="scanner-box"><div id="reader"></div></div>
        </div>
    </div>

    <div class="main-content">
        <img src="img/logo-isc.png" height="70" class="center-logo" alt="ISC Logo Center">
        
        <div class="faculty-counters">
            <div class="count-card"><h3>140</h3><p>Informatique</p></div>
            <div class="count-card"><h3>85</h3><p>Sciences Comm.</p></div>
            <div class="count-card"><h3>42</h3><p>Secrétariat</p></div>
        </div>

        <div class="scellage-form glass">
            <h2 class="form-title">SCELLAGE IMMUABLE (BLOCKCHAIN)</h2>
            <form id="anchorForm">
                <div class="grid">
                    <div class="field">
                        <label>Nom complet de l'étudiant</label>
                        <input type="text" id="stdName" placeholder="Ex: KALENDA LUSUMBA ICAR">
                    </div>
                    <div class="field">
                        <label>Matricule Académique</label>
                        <input type="text" id="stdMat" placeholder="Ex: ISC-2026-001">
                    </div>
                    <div class="field">
                        <label>Faculté</label>
                        <select id="stdFac" onchange="updateMajors()">
                            <option value="Info">Informatique de Gestion</option>
                            <option value="ScComm">Sciences Commerciales & Financières</option>
                            <option value="Secret">Secrétariat de Direction</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Filière / Option</label>
                        <select id="stdMajor">
                            </select>
                    </div>
                    <div class="field">
                        <label>Sexe</label>
                        <select id="stdSexe"><option>Masculin (M)</option><option>Féminin (F)</option></select>
                    </div>
                    <div class="field">
                        <label>Fichier du diplôme (PDF)</label>
                        <input type="file" id="stdFile">
                    </div>
                </div>
                <button type="button" class="btn-anchor" onclick="processBlockchainAnchor()">
                    <i class="fas fa-shield-alt"></i> Effectuer l'ancrage sécurisé
                </button>
            </form>

            <div id="qr-code-final" style="display:none;">
                <div id="canvas-qr"></div>
                <p style="color: var(--success); font-weight: bold; font-size: 12px; margin-top: 10px;">SCELLAGE RÉUSSI - TRACE GÉNÉRÉE</p>
            </div>
        </div>
    </div>

    <div class="sidebar-right glass">
        <div class="admin-profile glass">
            <div class="avatar-upload" onclick="document.getElementById('adminInput').click()">
                <img id="avatarImg" src="https://via.placeholder.com/150" alt="Profile">
                <div class="hint">CLIQUEZ POUR PHOTO</div>
            </div>
            <input type="file" id="adminInput" hidden onchange="loadAvatar(this)">
            
            <input type="text" id="adminName" placeholder="Identifiant SGA" style="width:100%; margin-bottom:10px;">
            <button class="btn-menu" onclick="validateSGASession()" style="background: var(--glass-right); border: 1px solid var(--accent-orange);">
                <i class="fas fa-fingerprint"></i> Signer la Session
            </button>
            <p id="sga-status" style="font-size: 10px; margin-top:10px; color: var(--danger); font-weight: bold;">SESSION NON SIGNÉE</p>
        </div>

        <div class="meta-card glass">
            <label style="color: #f6851b;"><i class="fab fa-ethereum"></i> MetaMask</label>
            <button class="btn-menu" onclick="connectWallet()" style="background: #111; margin-top: 5px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Fox.svg" width="16"> Connecter Wallet
            </button>
            <p id="wallet-addr" style="font-size: 9px; opacity: 0.6; word-break: break-all; margin-top: 5px;">Déconnecté</p>
        </div>

        <div class="clock">
            <div id="time-display">00:00:00</div>
            <div id="date-display" style="font-size: 12px; opacity: 0.7;">-- -- ----</div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION CONSOLE FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCAG6C8eHeF3C_-qhmfh8_hwiEN8itHmQQ",
            authDomain: "lgt-hub-archivage-isc.firebaseapp.com",
            databaseURL: "https://lgt-hub-archivage-isc-default-rtdb.firebaseio.com",
            projectId: "lgt-hub-archivage-isc",
            storageBucket: "lgt-hub-archivage-isc.appspot.com",
            messagingSenderId: "355077255297",
            appId: "1:355077255297:web:cbc97343febd93edbcdd80"
        };

        // Initialisation de Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const storage = firebase.storage();

        let isSGASigned = false;
        let html5QrScanner = null;

        // Répertoire des filières de l'ISC
        const filieres = {
            Info: ["Conception des Systèmes d'Information (CSI)", "Réseaux Informatiques", "Gestion Informatique"],
            ScComm: ["Comptabilité", "Marketing", "Fiscalité", "Banque et Assurance"],
            Secret: ["Secrétariat de Direction", "Hôtellerie et Accueil"]
        };

        function updateMajors() {
            const fac = document.getElementById('stdFac').value;
            const select = document.getElementById('stdMajor');
            select.innerHTML = filieres[fac].map(f => `<option>${f}</option>`).join('');
        }
        updateMajors();

        // --- 2. THÈME ET HORLOGE ---
        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        setInterval(() => {
            const d = new Date();
            document.getElementById('time-display').innerText = d.toLocaleTimeString();
            document.getElementById('date-display').innerText = d.toLocaleDateString('fr-FR', {weekday: 'long', day:'numeric', month:'long'});
        }, 1000);

        // --- 3. PROFIL ET VERROUILLAGE SGA ---
        function loadAvatar(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = e => document.getElementById('avatarImg').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }

        function validateSGASession() {
            const name = document.getElementById('adminName').value.trim();
            if(!name) return alert("Entrez votre identifiant Admin SGA !");
            isSGASigned = true;
            document.getElementById('sga-status').innerText = "SESSION SGA ACTIVE : " + name;
            document.getElementById('sga-status').style.color = "var(--success)";
            alert("Autorisation accordée pour l'ancrage.");
        }

        // --- 4. INTEGRATION METAMASK ---
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
                    document.getElementById('wallet-addr').innerText = "Connecté: " + accounts[0];
                    document.getElementById('wallet-addr').style.color = "var(--success)";
                } catch (e) { alert("Connexion refusée."); }
            } else {
                alert("Veuillez installer MetaMask sur votre navigateur !");
            }
        }

        // --- 5. MANAGEMENT DU SCANNER QR ---
        function toggleCamera() {
            const box = document.getElementById('scanner-box');
            if(box.style.display === "block") {
                box.style.display = "none";
                if (html5QrScanner) {
                    html5QrScanner.stop().then(() => { html5QrScanner = null; });
                }
            } else {
                box.style.display = "block";
                html5QrScanner = new Html5Qrcode("reader");
                html5QrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                (txt) => { 
                    document.getElementById('stdMat').value = txt; 
                    toggleCamera();
                },
                (err) => { /* Gestion silencieuse des frames */ });
            }
        }

        // --- 6. ARCHIVAGE & GENERATION DU QR CODE ---
        function processBlockchainAnchor() {
            if (!isSGASigned) {
                alert("🛑 ERREUR CRITIQUE : Action refusée ! Vous n'avez pas configuré votre profil Admin SGA.");
                return;
            }

            const name = document.getElementById('stdName').value.trim();
            const mat = document.getElementById('stdMat').value.trim();
            const fac = document.getElementById('stdFac').options[document.getElementById('stdFac').selectedIndex].text;
            const major = document.getElementById('stdMajor').value;
            const sexe = document.getElementById('stdSexe').value;
            const fileInput = document.getElementById('stdFile');

            if(!name || !mat || fileInput.files.length === 0) {
                return alert("Veuillez remplir toutes les informations et sélectionner le PDF du diplôme !");
            }

            const file = fileInput.files[0];
            const storageRef = storage.ref('diplomes_scelles/' + mat + '_' + file.name);

            alert("Connexion Firebase active. Envoi du document d'origine...");

            // Étape A : Téléversement du PDF vers le stockage cloud Firebase
            storageRef.put(file).then((snapshot) => {
                return snapshot.ref.getDownloadURL();
            }).then((downloadURL) => {
                
                // Simulation d'une empreinte cryptographique de bloc
                const mockHash = "0x" + Array.from({length:40}, () => Math.floor(Math.random()*16).toString(16)).join("");
                const timestamp = Date.now();

                // Étape B : Écriture des métadonnées dans l'arbre Realtime Database
                return database.ref('diplomes/' + mat).set({
                    nomEtudiant: name,
                    matricule: mat,
                    faculte: fac,
                    filiere: major,
                    sexe: sexe,
                    blockchainHash: mockHash,
                    dateAncrage: timestamp,
                    fileUrl: downloadURL
                }).then(() => {
                    // Étape C : Affichage et rendu graphique du QR Code pointant vers ton site de vérification externe
                    document.getElementById('qr-code-final').style.display = "block";
                    const qrBox = document.getElementById('canvas-qr');
                    qrBox.innerHTML = "";
                    
                    new QRCode(qrBox, {
                        text: `https://lgt-hub-archivage-isc.firebaseapp.com/verification.html?mat=${mat}`,
                        width: 130,
                        height: 130
                    });

                    alert(`✅ Félicitations ! Le diplôme de ${name} a été scellé et archivé avec succès.`);
                });
            }).catch((error) => {
                console.error(error);
                alert("Erreur lors de l'archivage. Assurez-vous d'avoir désactivé les restrictions d'écriture/lecture (Rules) sur votre console Firebase.");
            });
        }
    </script>
</body>
</html>
