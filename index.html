<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGT HUB | PORTAIL DE VÉRIFICATION OFFICIEL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/index.umd.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container { max-width: 500px; width: 100%; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 1.8rem; margin: 0; color: var(--accent); }
        .header p { color: var(--text-secondary); margin-top: 5px; font-weight: 500; }

        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
        }

        .form-group { margin-bottom: 25px; }
        .form-group label { display: block; color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; }
        .form-group input {
            width: 100%; padding: 16px; background-color: var(--bg-color);
            border: 2px solid var(--border-color); border-radius: 14px;
            color: white; font-size: 1rem; box-sizing: border-box;
        }

        .btn-main {
            width: 100%; padding: 16px; background-color: var(--accent);
            color: white; border: none; border-radius: 14px;
            font-size: 1rem; font-weight: 800; cursor: pointer; transition: 0.3s;
        }

        .btn-main:hover { background-color: var(--accent-hover); transform: translateY(-2px); }
        .btn-main:disabled { background-color: #475569; cursor: not-allowed; }

        /* SECTION RESULTATS */
        #resultSection { display: none; text-align: center; animation: fadeIn 0.5s ease-in; }

        .status-badge {
            background-color: rgba(16, 185, 129, 0.1); color: var(--success);
            padding: 10px 20px; border-radius: 50px; font-weight: bold; margin-bottom: 25px; display: inline-block;
        }

        .data-display {
            background-color: var(--bg-color); padding: 25px; border-radius: 18px;
            text-align: left; margin-bottom: 25px; border: 1px solid var(--border-color);
        }

        .data-item { margin-bottom: 20px; }
        .data-label { color: var(--text-secondary); font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        .data-value { font-size: 1rem; font-weight: 600; margin-top: 5px; word-break: break-all; }
        
        .doc-hash { font-family: 'Courier New', monospace; color: #60a5fa; font-size: 0.75rem; }

        .btn-view {
            width: 100%; padding: 14px; background-color: var(--success);
            color: white; border: none; border-radius: 12px;
            font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* ZONE APERÇU (TON IDÉE) */
        #folderPreview {
            display: none; margin-top: 25px; border-radius: 18px;
            overflow: hidden; border: 3px solid var(--accent);
            background: white; height: 500px;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>LGT HUB</h1>
            <p>BLOCKCHAIN CERTIFICATION SYSTEM</p>
        </div>

        <div class="card">
            <div id="searchSection">
                <div class="form-group">
                    <label>IDENTIFIANT ACADÉMIQUE (MATRICULE)</label>
                    <input type="text" id="matInput" placeholder="Ex: ISC-2026-001" autocomplete="off">
                </div>
                <button class="btn-main" onclick="verifierSysteme()" id="btnCheck">VÉRIFIER LE DOSSIER</button>
            </div>

            <div id="resultSection">
                <div class="status-badge">✅ CERTIFIÉ PAR L'ISC</div>
                
                <div class="data-display">
                    <div class="data-item">
                        <div class="data-label">NOM DE L'ÉTUDIANT</div>
                        <div class="data-value" id="dispName">...</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">MATRICULE</div>
                        <div class="data-value" id="dispMat">...</div>
                    </div>
                    <div class="data-item">
                        <div class="data-label">HASH BLOCKCHAIN (PREUVE)</div>
                        <div class="data-value doc-hash" id="dispHash">...</div>
                    </div>
                </div>

                <button class="btn-view" onclick="afficherDossier()">
                    👁️ VOIR LE CONTENU DU DOSSIER
                </button>
                
                <button class="btn-main" style="background-color: transparent; border: 1px solid var(--border-color); color: var(--text-secondary);" onclick="window.location.reload()">
                    NOUVELLE RECHERCHE
                </button>
            </div>

            <div id="folderPreview">
                <iframe id="pdfFrame" src="" width="100%" height="100%" style="border:none;"></iframe>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION DU SMART CONTRACT
        const contractAddress = "0xd9145CCE7a471D916a029e0e7caeb74cfb1d24ed9";
        const abi = [
            {"inputs":[{"internalType":"string","name":"_matricule","type":"string"}],"name":"verifierDiplome","outputs":[{"internalType":"string","name":"","type":"string"},{"internalType":"uint256","name":"","type":"uint256"},{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"}
        ];

        // CONNEXION RÉSEAU SEPOLIA (Public RPC)
        const provider = new ethers.JsonRpcProvider("https://rpc.ankr.com/eth_sepolia");
        const contract = new ethers.Contract(contractAddress, abi, provider);

        async function verifierSysteme() {
            const matricule = document.getElementById('matInput').value.trim();
            const btn = document.getElementById('btnCheck');

            if (!matricule) return alert("Veuillez saisir un matricule valide.");

            try {
                btn.innerText = "CONNEXION BLOCKCHAIN...";
                btn.disabled = true;

                // APPEL RÉEL DU CONTRAT
                const result = await contract.verifierDiplome(matricule);
                const docHash = result[0];
                const isCertified = result[2];

                if (isCertified === true && docHash !== "") {
                    // Masquer recherche, afficher succès
                    document.getElementById('searchSection').style.display = 'none';
                    document.getElementById('resultSection').style.display = 'block';
                    
                    // Remplissage des données
                    document.getElementById('dispName').innerText = "ÉTUDIANT ARCHIVÉ"; 
                    document.getElementById('dispMat').innerText = matricule;
                    document.getElementById('dispHash').innerText = docHash;

                    // On prépare le PDF (Assure-toi que le fichier existe sur ton GitHub)
                    document.getElementById('pdfFrame').src = "Dossier_Etudiant.pdf";
                } else {
                    alert("Ce matricule n'est pas encore ancré sur la Blockchain.");
                }

            } catch (error) {
                console.error(error);
                alert("Erreur de connexion. Vérifie ta connexion internet.");
            } finally {
                btn.innerText = "VÉRIFIER LE DOSSIER";
                btn.disabled = false;
            }
        }

        function afficherDossier() {
            const preview = document.getElementById('folderPreview');
            preview.style.display = "block";
            preview.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
