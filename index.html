<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGT HUB | PORTAIL DE VÉRIFICATION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/index.umd.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #f1f5f9; --success: #10b981; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 10px; }
        .card { background: var(--card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-check { background: var(--accent); color: white; }
        .btn-view { background: var(--success); color: white; margin-top: 15px; display: none; }
        #result { display: none; margin-top: 20px; text-align: left; background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; }
        iframe { display: none; width: 100%; height: 450px; border-radius: 10px; border: 2px solid var(--accent); margin-top: 15px; background: white; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: var(--accent); margin-bottom: 5px;">LGT HUB</h2>
    <p style="color: #94a3b8; margin-top: 0; font-size: 0.9rem;">Système de Certification Blockchain</p>
    
    <div id="searchBox">
        <input type="text" id="matInput" placeholder="Entrez le matricule (ex: ISC-2026-001)">
        <button class="btn btn-check" onclick="verifier()">VÉRIFIER LE DOSSIER</button>
    </div>

    <div id="result">
        <p style="margin-top:0;"><strong>Statut :</strong> <span style="color: var(--success);">✅ CERTIFIÉ</span></p>
        <p><strong>Étudiant :</strong> <span id="resName">CALCUL EN COURS...</span></p>
        <p><strong>Hash (Preuve) :</strong> <br><small id="resHash" style="word-break: break-all; color: #60a5fa; font-family: monospace;"></small></p>
        <button id="viewBtn" class="btn btn-view" onclick="montrerPDF()">👁️ VOIR LE DOCUMENT PDF</button>
    </div>

    <iframe id="pdfPreview" src="Dossier_Etudiant.pdf"></iframe>
</div>

<script>
    // ADRESSE MISE À JOUR PAR ICAR
    const contractAddress = "0xF031D80aB69cdDaAFD7cb6Ac53e35164c70D18ce";
    
    const abi = [{"inputs":[{"internalType":"string","name":"_matricule","type":"string"}],"name":"verifierDiplome","outputs":[{"internalType":"string","name":"","type":"string"},{"internalType":"uint256","name":"","type":"uint256"},{"internalType":"bool","name":"","type":"bool"}],"stateMutability":"view","type":"function"}];

    async function verifier() {
        const mat = document.getElementById('matInput').value.trim();
        const btn = document.querySelector('.btn-check');
        
        if(!mat) { alert("Entre un matricule !"); return; }

        try {
            btn.innerText = "CONNEXION SEPOLIA...";
            btn.disabled = true;

            // Utilisation du tunnel ultra-stable 1RPC
            const provider = new ethers.JsonRpcProvider("https://1rpc.io/sepolia");
            const contract = new ethers.Contract(contractAddress, abi, provider);
            
            const res = await contract.verifierDiplome(mat);
            
            // res[2] est le booléen "estValide"
            if (res[2] === true) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('resName').innerText = "VÉRIFIÉ DANS LE REGISTRE";
                document.getElementById('resHash').innerText = res[0]; // C'est le hashDocument
                document.getElementById('viewBtn').style.display = 'block';
                btn.innerText = "RÉSULTAT TROUVÉ";
            } else {
                alert("Ce matricule n'est pas enregistré dans la Blockchain.");
                btn.innerText = "VÉRIFIER LE DOSSIER";
                btn.disabled = false;
            }
        } catch (e) {
            console.error(e);
            alert("Erreur de connexion au réseau. Réessaie dans 10 secondes.");
            btn.innerText = "VÉRIFIER LE DOSSIER";
            btn.disabled = false;
        }
    }

    function montrerPDF() {
        const frame = document.getElementById('pdfPreview');
        frame.style.display = 'block';
        frame.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
