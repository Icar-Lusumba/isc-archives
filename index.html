<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGT HUB ISC | Console d'Administration Blockchain</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* Couleurs Verre Transparentes Floutées (Premium Dark) */
            --glass-left: rgba(0, 180, 216, 0.12); /* Bleu cyan électrique subtil */
            --glass-right: rgba(114, 9, 183, 0.12); /* Violet néon sophistiqué */
            --glass-center: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            
            --accent-orange: #ff7a00;
            --text-white: #ffffff;
            --danger: #ff4d4d;
            --success: #00ff88;
            --bg-overlay: rgba(10, 11, 30, 0.75); /* Permet de voir le fond tout en restant lisible */
        }

        /* Thème Clair Épuré */
        body.light-mode {
            --glass-left: rgba(240, 248, 255, 0.75);
            --glass-right: rgba(245, 243, 247, 0.75);
            --glass-center: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(0, 0, 0, 0.08);
            --text-white: #121214;
            --bg-overlay: rgba(255, 255, 255, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }

        body {
            background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), url('img/fond.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-white);
            height: 100vh;
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            overflow: hidden;
        }

        /* Structure Glassmorphism */
        .glass { 
            backdrop-filter: blur(20px) saturate(160%); 
            -webkit-backdrop-filter: blur(20px) saturate(160%); 
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* --- COLONNE GAUCHE --- */
        .sidebar-left { background: var(--glass-left); padding: 25px; display: flex; flex-direction: column; gap: 20px; border-right: 1px solid var(--glass-border); }
        .logo-header { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; border-bottom: 1px solid var(--glass-border); }
        .logo-header img { height: 50px; filter: drop-shadow(0 0 8px rgba(0, 180, 216, 0.4)); }
        
        .btn-menu {
            width: 100%; padding: 14px 18px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.05);
            color: var(--text-white); text-align: left; cursor: pointer; font-weight: 700; font-size: 13px;
            display: flex; align-items: center; gap: 12px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-menu:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }
        .btn-menu.active { background: linear-gradient(135deg, var(--accent-orange), #ff9e00); border: none; box-shadow: 0 4px 20px rgba(255, 122, 0, 0.4); color: #fff; }

        #scanner-box { display: none; background: #000; border-radius: 14px; overflow: hidden; margin-top: 10px; border: 2px solid var(--accent-orange); box-shadow: 0 0 15px rgba(255,122,0,0.3); }

        /* --- COLONNE CENTRALE --- */
        .main-content { padding: 30px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .center-logo { margin-bottom: 20px; filter: drop-shadow(0 4px 12px rgba(255,255,255,0.2)); }
        
        /* Compteurs Modernes */
        .faculty-counters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 100%; max-width: 850px; margin-bottom: 25px; }
        .count-card { padding: 20px; border-radius: 18px; text-align: center; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        .count-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-orange); }
        .count-card h3 { font-size: 32px; font-weight: 800; color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        .count-card p { font-size: 11px; font-weight: 800; opacity: 0.7; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-orange); }

        /* Formulaire */
        .scellage-form { width: 100%; max-width: 850px; padding: 30px; border-radius: 24px; background: var(--glass-center); box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .form-title { text-align: center; margin-bottom: 25px; font-weight: 900; letter-spacing: 1.5px; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.4); font-size: 22px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
        label { font-size: 11px; font-weight: 800; color: var(--accent-orange); text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { 
            padding: 14px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.4); color: #fff; outline: none; font-weight: 600; font-size: 14px;
        }
        input:focus, select:focus { border-color: var(--accent-orange); background: rgba(0, 0, 0, 0.6); }

        .btn-anchor {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--accent-orange), #ff9e00); border: none;
            border-radius: 14px; color: white; font-weight: 900; cursor: pointer; font-size: 15px;
            text-transform: uppercase; margin-top: 20px; letter-spacing: 1px; box-shadow: 0 4px 20px rgba(255,122,0,0.3);
        }
        .btn-anchor:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(255,122,0,0.5); }

        /* --- COLONNE DROITE --- */
        .sidebar-right { background: var(--glass-right); padding: 25px; display: flex; flex-direction: column; gap: 25px; border-left: 1px solid var(--glass-border); }
        
        /* Avatar Profil */
        .admin-profile { text-align: center; padding: 25px; border-radius: 22px; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.05); }
        
        .avatar-container { position: relative; width: 115px; height: 115px; margin: 0 auto 18px; }
        .avatar-upload {
            width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--accent-orange);
            overflow: hidden; cursor: pointer; position: relative; box-shadow: 0 0 15px rgba(255,122,0,0.2);
        }
        .avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload .hint {
            position: absolute; bottom: 0; background: rgba(0,0,0,0.75); width: 100%; 
            font-size: 9px; padding: 6px 0; color: #fff; font-weight: 800; letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .avatar-upload:hover { border-color: #fff; transform: scale(1.03); }

        .meta-card { padding: 18px; border-radius: 16px; background: rgba(0,0,0,0.4); border-left: 4px solid #f6851b; }
        
        .clock { 
            margin-top: auto; text-align: center; font-family: 'Courier New', Courier, monospace; 
            font-size: 24px; font-weight: bold; color: var(--accent-orange); padding: 18px; 
            border-radius: 14px; background: rgba(0,0,0,0.35); border: 1px solid var(--glass-border);
            text-shadow: 0 0 10px rgba(255, 122, 0, 0.2);
        }

        #qr-code-final { margin-top: 25px; text-align: center; animation: fadeIn 0.5s ease; }
        #canvas-qr { background: white; padding: 12px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 25px rgba(0,0,0,0.4); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="sidebar-left glass">
        <div class="logo-header">
            <img src="img/logo-isc.png" alt="ISC Logo">
            <span style="font-weight: 900; font-size: 15px; letter-spacing: 0.5px;">LGT HUB ISC</span>
        </div>
        <button class="btn-menu active"><i class="fas fa-plus-circle"></i> Nouveau Scellage</button>
        <button class="btn-menu"><i class="fas fa-database"></i> Registre Global</button>
        <button class="btn-menu" onclick="window.open('verification.html')"><i class="fas fa-external-link-alt"></i> Vérification Publique</button>
        <button class="btn-menu" onclick="toggleTheme()"><i class="fas fa-adjust"></i> Mode Clair/Sombre</button>
        
        <div style="margin-top: 15px;">
            <label>Scanner QR Matricule</label>
            <button class="btn-menu" id="cam-toggle" onclick="toggleCamera()" style="background: rgba(0,0,0,0.4); margin-top:8px; border-color: rgba(255,255,255,0.1);">
                <i class="fas fa-camera" style="color: var(--accent-orange);"></i> Activer Caméra
            </button>
            <div id="scanner-box"><div id="reader"></div></div>
        </div>
    </div>

    <div class="main-content">
        <img src="img/logo-isc.png" height="75" class="center-logo" alt="ISC Centered">
        
        <div class="faculty-counters">
            <div class="count-card">
                <h3 id="count-info">...</h3>
                <p>Informatique</p>
            </div>
            <div class="count-card">
                <h3 id="count-sccomm">...</h3>
                <p>Sciences Comm.</p>
            </div>
            <div class="count-card">
                <h3 id="count-secret">...</h3>
                <p>Secrétariat</p>
            </div>
        </div>

        <div class="scellage-form glass">
            <h2 class="form-title">SCELLAGE IMMUABLE (BLOCKCHAIN)</h2>
            <form id="anchorForm">
                <div class="grid">
                    <div class="field">
                        <label>Nom complet de l'étudiant</label>
                        <input type="text" id="stdName" placeholder="Ex: KALENDA LUSUMBA ICAR">
                    </div>
                    <div class="field">
                        <label>Matricule Académique</label>
                        <input type="text" id="stdMat" placeholder="Ex: ISC-2026-001">
                    </div>
                    <div class="field">
                        <label>Faculté</label>
                        <select id="stdFac" onchange="updateMajors()">
                            <option value="Info">Informatique de Gestion</option>
                            <option value="ScComm">Sciences Commerciales & Financières</option>
                            <option value="Secret">Secrétariat de Direction</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Filière / Option</label>
                        <select id="stdMajor">
                            </select>
                    </div>
                    <div class="field">
                        <label>Sexe</label>
                        <select id="stdSexe"><option>Masculin (M)</option><option>Féminin (F)</option></select>
                    </div>
                    <div class="field">
                        <label>Fichier du diplôme (PDF)</label>
                        <input type="file" id="stdFile" accept="application/pdf">
                    </div>
                </div>
                <button type="button" class="btn-anchor" onclick="processBlockchainAnchor()">
                    <i class="fas fa-shield-alt"></i> Effectuer l'ancrage sécurisé
                </button>
            </form>

            <div id="qr-code-final" style="display:none;">
                <div id="canvas-qr"></div>
                <p style="color: var(--success); font-weight: bold; font-size: 13px; margin-top: 12px; letter-spacing: 0.5px;">SCELLAGE REUSSI — TRACE DISTRIBUÉE</p>
            </div>
        </div>
    </div>

    <div class="sidebar-right glass">
        <div class="admin-profile glass">
            <div class="avatar-container">
                <div class="avatar-upload" onclick="document.getElementById('adminInput').click()">
                    <img id="avatarImg" src="https://via.placeholder.com/150" alt="Profile">
                    <div class="hint">Changer photo</div>
                </div>
            </div>
            <input type="file" id="adminInput" hidden onchange="loadAvatar(this)" accept="image/*">
            
            <input type="text" id="adminName" placeholder="Identifiant SGA" style="width:100%; margin-bottom:12px;">
            <input type="email" id="adminEmail" placeholder="Adresse Email Admin" style="width:100%; margin-bottom:15px;">
            
            <button class="btn-menu" onclick="validateSGASession()" style="background: rgba(255,255,255,0.03); border: 1px solid var(--accent-orange); justify-content: center;">
                <i class="fas fa-fingerprint" style="color: var(--accent-orange);"></i> Signer la Session
            </button>
            <p id="sga-status" style="font-size: 11px; margin-top:12px; color: var(--danger); font-weight: 800; letter-spacing: 0.5px;">SESSION INTERDITE</p>
        </div>

        <div class="meta-card glass">
            <label style="color: #f6851b; font-weight: 800;"><i class="fab fa-ethereum"></i> Extension MetaMask</label>
            <button class="btn-menu" onclick="connectWallet()" style="background: #090a10; margin-top: 10px; border-color: #f6851b;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/36/MetaMask_Fox.svg" width="16"> Connecter Node Web3
            </button>
            <p id="wallet-addr" style="font-size: 10px; opacity: 0.6; word-break: break-all; margin-top: 8px; font-family: monospace;">Node: Déconnecté</p>
        </div>

        <div class="clock">
            <div id="time-display">00:00:00</div>
            <div id="date-display" style="font-size: 13px; opacity: 0.7; margin-top: 4px; font-weight: 600; font-family: sans-serif;">-- -- ----</div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION DU PROJET FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyCAG6C8eHeF3C_-qhmfh8_hwiEN8itHmQQ",
            authDomain: "lgt-hub-archivage-isc.firebaseapp.com",
            databaseURL: "https://lgt-hub-archivage-isc-default-rtdb.firebaseio.com",
            projectId: "lgt-hub-archivage-isc",
            storageBucket: "lgt-hub-archivage-isc.appspot.com",
            messagingSenderId: "355077255297",
            appId: "1:355077255297:web:cbc97343febd93edbcdd80"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        const storage = firebase.storage();

        let isSGASigned = false;
        let html5QrScanner = null;

        // --- 2. BRANCHEMENT DES COMPTEURS TEMPS RÉEL ---
        function initRealtimeCounters() {
            database.ref('diplomes').on('value', (snapshot) => {
                let countInfo = 0;
                let countScComm = 0;
                let countSecret = 0;

                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        // Vérification basée sur la valeur stockée (Faculté)
                        if (data.faculte === "Informatique de Gestion") countInfo++;
                        else if (data.faculte === "Sciences Commerciales & Financières") countScComm++;
                        else if (data.faculte === "Secrétariat de Direction") countSecret++;
                    });
                }
                
                document.getElementById('count-info').innerText = countInfo;
                document.getElementById('count-sccomm').innerText = countScComm;
                document.getElementById('count-secret').innerText = countSecret;
            });
        }
        // Lancement immédiat de l'écoute temps réel
        initRealtimeCounters();

        // Nomenclature officielle ISC Lubumbashi
        const filieres = {
            Info: ["Conception des Systèmes d'Information (CSI)", "Réseaux Informatiques", "Gestion Informatique"],
            ScComm: ["Comptabilité", "Marketing", "Fiscalité", "Banque et Assurance"],
            Secret: ["Secrétariat de Direction", "Hôtellerie et Accueil"]
        };

        function updateMajors() {
            const fac = document.getElementById('stdFac').value;
            const select = document.getElementById('stdMajor');
            select.innerHTML = filieres[fac].map(f => `<option>${f}</option>`).join('');
        }
        updateMajors();

        // --- 3. COMMUTATEUR DE COULEUR DE FOND ---
        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        setInterval(() => {
            const d = new Date();
            document.getElementById('time-display').innerText = d.toLocaleTimeString();
            document.getElementById('date-display').innerText = d.toLocaleDateString('fr-FR', {weekday: 'long', day:'numeric', month:'long'});
        }, 1000);

        // --- 4. GESTION DU PROFIL ET DU MAIL ---
        function loadAvatar(input) {
            if (input.files && input.files[0]) {
                let reader = new FileReader();
                reader.onload = e => document.getElementById('avatarImg').src = e.target.result;
                reader.readAsDataURL(input.files[0]);
            }
        }

        function validateSGASession() {
            const name = document.getElementById('adminName').value.trim();
            const email = document.getElementById('adminEmail').value.trim();
            
            if(!name || !email) {
                return alert("Veuillez saisir votre Identifiant SGA ET votre adresse Email d'accréditation !");
            }
            
            isSGASigned = true;
            const statusLabel = document.getElementById('sga-status');
            statusLabel.innerText = "SGA CONNECTÉ : " + name;
            statusLabel.style.color = "var(--success)";
            alert(`Accréditation validée pour l'administrateur :\n${name} (${email})`);
        }

        // --- 5. CONNECTIVITÉ INTERFACE METAMASK ---
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const accounts = await ethereum.request({ method: 'eth_requestAccounts' });
                    document.getElementById('wallet-addr').innerText = "Node: " + accounts[0];
                    document.getElementById('wallet-addr').style.color = "var(--success)";
                } catch (e) { alert("Connexion annulée par l'opérateur."); }
            } else {
                alert("Veuillez installer le plug-in MetaMask.");
            }
        }

        // --- 6. CONTRÔLE LOGIQUE DU SCANNER QR ---
        function toggleCamera() {
            const box = document.getElementById('scanner-box');
            if(box.style.display === "block") {
                box.style.display = "none";
                if (html5QrScanner) {
                    html5QrScanner.stop().then(() => { html5QrScanner = null; });
                }
            } else {
                box.style.display = "block";
                html5QrScanner = new Html5Qrcode("reader");
                html5QrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
                (txt) => { 
                    document.getElementById('stdMat').value = txt; 
                    toggleCamera();
                },
                (err) => {});
            }
        }

        // --- 7. TRAITEMENT, REQUÊTE ET ANCRAGE CLOUD ---
        function processBlockchainAnchor() {
            if (!isSGASigned) {
                alert("🛑 OPÉRATION INTERDITE : Votre jeton de session SGA n'est pas signé à droite !");
                return;
            }

            const name = document.getElementById('stdName').value.trim();
            const mat = document.getElementById('stdMat').value.trim();
            const fac = document.getElementById('stdFac').options[document.getElementById('stdFac').selectedIndex].text;
            const major = document.getElementById('stdMajor').value;
            const sexe = document.getElementById('stdSexe').value;
            const fileInput = document.getElementById('stdFile');

            if(!name || !mat || fileInput.files.length === 0) {
                return alert("Tous les champs de l'étudiant sont obligatoires, y compris le fichier PDF !");
            }

            const file = fileInput.files[0];
            const storageRef = storage.ref('diplomes_scelles/' + mat + '_' + file.name);

            alert("Transmission des paquets binaires vers Firebase Storage...");

            // Stockage Cloud du PDF
            storageRef.put(file).then((snapshot) => {
                return snapshot.ref.getDownloadURL();
            }).then((downloadURL) => {
                
                // Empreinte hexadécimale simulée (Hachage de bloc)
                const mockHash = "0x" + Array.from({length:40}, () => Math.floor(Math.random()*16).toString(16)).join("");
                const timestamp = Date.now();

                // Injection Realtime Database (Mise à jour instantanée des compteurs grâce à l'observateur .on())
                return database.ref('diplomes/' + mat).set({
                    nomEtudiant: name,
                    matricule: mat,
                    faculte: fac,
                    filiere: major,
                    sexe: sexe,
                    blockchainHash: mockHash,
                    dateAncrage: timestamp,
                    fileUrl: downloadURL
                }).then(() => {
                    // Construction du QR code
                    document.getElementById('qr-code-final').style.display = "block";
                    const qrBox = document.getElementById('canvas-qr');
                    qrBox.innerHTML = "";
                    
                    new QRCode(qrBox, {
                        text: `https://lgt-hub-archivage-isc.firebaseapp.com/verification.html?mat=${mat}`,
                        width: 130,
                        height: 130
                    });

                    alert(`✅ Succès absolu !\nDiplôme archivé et enregistré cryptographiquement.`);
                });
            }).catch((error) => {
                console.error(error);
                alert("Erreur technique de communication. Vérifiez vos autorisations Firebase Realtime & Storage.");
            });
        }
    </script>
</body>
</html>
