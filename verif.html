<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification Publique - Blockchain ISC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Code CSS original de ton portail de vérification */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Utilisation de ton image de fond webp comme vu dans tes dossiers */
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('assets/img/fond.webp');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .verification-container {
            background-color: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #334155;
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 550px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .logo-section {
            margin-bottom: 25px;
        }

        .logo-section img {
            width: 80px;
            height: auto;
            margin-bottom: 15px;
        }

        .logo-section h2 {
            font-size: 24px;
            color: #f8fafc;
        }

        .logo-section p {
            color: #38bdf8;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .search-box {
            margin-top: 30px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px;
            padding-left: 50px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f8fafc;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            border-color: #38bdf8;
        }

        .search-box i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 18px;
        }

        .verify-btn {
            width: 100%;
            background-color: #38bdf8;
            color: #0f172a;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .verify-btn:hover {
            background-color: #0ea5e9;
        }

        .footer-text {
            margin-top: 35px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="verification-container">
        <div class="logo-section">
            <img src="assets/img/logo-isc.webp" alt="Logo ISC">
            <h2>Portail de Vérification Public</h2>
            <p>Institut Supérieur de Commerce</p>
        </div>

        <p style="color: #94a3b8; font-size: 15px; line-height: 1.6;">
            Entrez l'identifiant unique ou l'adresse de hachage Blockchain du diplôme pour vérifier instantanément sa validité.
        </p>

        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" placeholder="Ex: 0x71C... ou ID Diplôme">
        </div>

        <button class="verify-btn">
            <i class="fas fa-shield-check"></i> Vérifier l'authenticité
        </button>

        <div class="footer-text">
            <p>© 2025 ISC Lubumbashi - Système Sécurisé Blockchain</p>
        </div>
    </div>

</body>
</html>
