<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGT HUB | Vérification Blockchain ISC</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #1e3a8a;
            --accent: #f6851b;
            --success: #10b981;
            --danger: #ef4444;
            --warn: #f59e0b;
            --bg-body: #f8fafc;
            --bg-image: url("https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2070");
            --glass-bg: rgba(255, 255, 255, 0.45);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text: #0f172a;
            --text-secondary: #475569;
            --shadow-glow: rgba(30, 58, 138, 0.08);
            --card-radius: 24px;
        }

        .dark-mode {
            --primary: #3b82f6;
            --accent: #f6851b;
            --bg-body: #090d16;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-secondary: #94a3b8;
            --shadow-glow: rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(248, 250, 252, 0.35), rgba(248, 250, 252, 0.45)), var(--bg-image);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: var(--text);
            transition: all 0.4s ease;
            padding: 20px;
        }

        .dark-mode-body {
            background: linear-gradient(rgba(9, 13, 22, 0.88), rgba(9, 13, 22, 0.92)), var(--bg-image) !important;
            background-size: cover !important;
            background-attachment: fixed !important;
        }

        .main-container {
            width: 100%;
            max-width: 900px; /* Increased max-width for two columns */
            perspective: 1000px;
            animation: fadeIn 0.8s ease-out;
            display: flex;
            gap: 20px; /* Space between the two blocks */
            flex-wrap: wrap; /* Allow wrapping on smaller screens */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-card {
            background: var(--glass-bg);
            -webkit-backdrop-filter: blur(25px);
            backdrop-filter: blur(25px);
            border-radius: var(--card-radius);
            padding: 40px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px var(--shadow-glow);
            text-align: center;
            position: relative;
            overflow: hidden;
            flex: 1; /* Make cards take equal width */
            min-width: 300px; /* Minimum width before wrapping */
        }

        .brand-section {
            margin-bottom: 30px;
        }

        .brand-logo {
            font-size: 45px;
            color: var(--accent);
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 10px rgba(246, 133, 27, 0.3));
        }

        .brand-name {
            font-weight: 800;
            font-size: 1.8rem;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .brand-tagline {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 5px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
        }

        label {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
            padding-left: 5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        input {
            padding: 14px 14px 14px 45px;
            border-radius: 14px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
            color: var(--text);
            outline: none;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
        }

        .dark-mode input {
            background: rgba(15, 23, 42, 0.6) !important;
            color: #fff !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.15);
            background: white;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 10px 20px rgba(30, 58, 138, 0.2);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(30, 58, 138, 0.3);
        }

        .btn:active { transform: translateY(-1px); }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent), #ff9a3d);
            box-shadow: 0 10px 20px rgba(246, 133, 27, 0.2);
        }

        .btn-accent:hover {
            box-shadow: 0 15px 30px rgba(246, 133, 27, 0.3);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            box-shadow: none;
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }

        #qr-reader-container {
            display: none;
            margin-top: 20px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--primary);
            position: relative;
        }

        #qr-reader {
            width: 100% !important;
            border: none !important;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-secondary);
        }

        .status-online { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .status-offline { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        #verifResult {
            margin-top: 30px;
            text-align: left;
        }

        .result-card {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 25px;
            border-left: 6px solid var(--success);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            animation: slideIn 0.5s ease-out;
        }

        .dark-mode .result-card {
            background: rgba(30, 41, 59, 0.6);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .result-header {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-item {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
        }

        .result-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 800;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .result-value {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
        }

        .hash-value {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.05);
            padding: 8px;
            border-radius: 8px;
            margin-top: 5px;
        }

        .live-clock-box {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg);
            padding: 8px 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
        }

        .theme-toggle-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
        }

        .theme-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }

        .theme-btn:hover { transform: rotate(30deg) scale(1.1); }

        #toastContainer { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 700;
            color: white;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast.success { background: rgba(16, 185, 129, 0.9); }
        .toast.error { background: rgba(239, 68, 68, 0.9); }
        .toast.info { background: rgba(30, 58, 138, 0.9); }

        @keyframes toastIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        @media (max-width: 900px) {
            .main-container { flex-direction: column; }
            .glass-card { min-width: unset; }
        }
        @media (max-width: 500px) {
            .glass-card { padding: 25px; }
            .action-grid { grid-template-columns: 1fr; }
            .brand-name { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Bloc 1: Scan QR et Reconnexion -->
        <div class="glass-card">
            <div class="brand-section">
                <i class="fas fa-qrcode brand-logo"></i>
                <h2 class="brand-name">SCANNER RAPIDE</h2>
                <p class="brand-tagline">Scannez un QR Code de diplôme pour une vérification instantanée.</p>
            </div>

            <button class="btn btn-accent" onclick="toggleQRScanner()" id="btnQR">
                <i class="fas fa-camera"></i>
                DÉMARRER LE SCANNER QR
            </button>

            <div id="qr-reader-container">
                <div id="qr-reader"></div>
                <button class="btn btn-danger" style="border-radius: 0 0 16px 16px; padding: 10px;" onclick="stopQRScanner()">
                    FERMER LE SCANNER
                </button>
            </div>

            <button class="btn btn-outline" style="margin-top: 20px;" onclick="initBlockchainConnection()">
                <i class="fas fa-sync"></i>
                RECONNECTER BLOCKCHAIN
            </button>

            <div class="status-badge" id="statusBadge" style="margin-top: 20px;">
                <i class="fas fa-circle-nodes"></i>
                <span id="connectionStatus">Connexion au réseau...</span>
            </div>
        </div>

        <!-- Bloc 2: Saisie Manuelle et Vérification -->
        <div class="glass-card">
            <div class="brand-section">
                <i class="fas fa-id-card-alt brand-logo" style="color: var(--primary);"></i>
                <h2 class="brand-name">VÉRIFICATION MANUELLE</h2>
                <p class="brand-tagline">Entrez les informations du diplôme pour vérifier son authenticité.</p>
            </div>

            <div class="input-section">
                <div class="input-group">
                    <label for="verifMat">Matricule Étudiant</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="verifMat" placeholder="Ex: 2026-ISC-001">
                    </div>
                </div>

                <div class="input-group">
                    <label for="verifFile">Document Source (Optionnel)</label>
                    <div class="input-wrapper">
                        <i class="fas fa-file-pdf"></i>
                        <input type="file" id="verifFile" accept=".pdf,image/*">
                    </div>
                </div>

                <button class="btn btn-accent" onclick="verifierIntegrite()" id="btnVerifier">
                    <i class="fas fa-magnifying-glass"></i>
                    VÉRIFIER L'AUTHENTICITÉ
                </button>
            </div>

            <div id="verifResult"></div>
        </div>
    </div>

    <div class="live-clock-box">
        <i class="fas fa-clock"></i>
        <span id="liveClock">Chargement...</span>
    </div>

    <div class="theme-toggle-box">
        <div class="theme-btn" onclick="toggleTheme()">
            <i id="themeIcon" class="fas fa-moon"></i>
        </div>
    </div>

    <div id="toastContainer"></div>

    <script>
        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDfbXYFsxWMEGlswSsk13BFrdNj_WCAp-Y",
            authDomain: "lgt-hub-archives-isc-59416.firebaseapp.com",
            databaseURL: "https://lgt-hub-archives-isc-59416-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "lgt-hub-archives-isc-59416",
            storageBucket: "lgt-hub-archives-isc-59416.firebasestorage.app",
            messagingSenderId: "892573543683",
            appId: "1:892573543683:web:0b8a05d7c2d4778c9ccd36",
            measurementId: "G-XJZ9EEQFQM"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // Configuration Blockchain
        let provider, contractInstance = null;
        const contractAddress = "0xAA95c2D9A2F9CD30391ecFf7a61c66142140a10c";
        const contractABI = [
            { "inputs": [{ "internalType": "string", "name": "_mat", "type": "string" }], "name": "verifierDiplome",
              "outputs": [ { "components": [
                { "internalType": "string", "name": "nomEtudiant", "type": "string" },
                { "internalType": "string", "name": "matricule", "type": "string" },
                { "internalType": "string", "name": "faculte", "type": "string" },
                { "internalType": "string", "name": "filiere", "type": "string" },
                { "internalType": "string", "name": "promotion", "type": "string" },
                { "internalType": "string", "name": "mention", "type": "string" },
                { "internalType": "string", "name": "sexe", "type": "string" },
                { "internalType": "string", "name": "documentHash", "type": "string" },
                { "internalType": "uint256", "name": "dateEnregistrement", "type": "uint256" },
                { "internalType": "address", "name": "auteurAction", "type": "address" },
                { "internalType": "bool", "name": "estValide", "type": "bool" }
              ], "internalType": "struct LGT_HUB_Archives.Diplome", "name": "", "type": "tuple" } ],
              "stateMutability": "view", "type": "function" }
        ];

        // --- Fonctions Utilitaires ---
        function toast(message, type = "info") {
            const container = document.getElementById("toastContainer");
            const el = document.createElement("div");
            el.className = `toast ${type}`;
            const icon = type === "success" ? "fa-check-circle" : type === "error" ? "fa-exclamation-circle" : "fa-info-circle";
            el.innerHTML = `<i class="fas ${icon}"></i><span>${message}</span>`;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = "0";
                el.style.transform = "translateX(50px)";
                el.style.transition = "all 0.4s ease";
                setTimeout(() => el.remove(), 400);
            }, 4000);
        }

        function startClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('liveClock').innerText = now.toLocaleString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
            }, 1000);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode-body');
            document.documentElement.classList.toggle('dark-mode');
            const isDark = document.documentElement.classList.contains('dark-mode');
            document.getElementById('themeIcon').className = isDark ? "fas fa-sun" : "fas fa-moon";
        }

        // --- Connexion Blockchain avec Fallback ---
        async function initBlockchainConnection() {
            const statusText = document.getElementById('connectionStatus');
            const statusBadge = document.getElementById('statusBadge');
            
            try {
                statusText.innerText = "Connexion en cours...";
                statusBadge.className = "status-badge"; // Reset status
                
                // 1. Essayer MetaMask
                if (window.ethereum) {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    const network = await provider.getNetwork();
                    
                    if (network.chainId === 11155111) { // Sepolia
                        contractInstance = new ethers.Contract(contractAddress, contractABI, provider);
                        statusText.innerText = "Connecté : MetaMask (Sepolia)";
                        statusBadge.classList.add("status-online");
                        toast("Blockchain connectée via MetaMask", "success");
                        return;
                    }
                }

                // 2. Fallback : RPC Public (Sepolia)
                // Note: Utilisez un RPC public stable pour Sepolia
                const publicRPC = "https://ethereum-sepolia-rpc.publicnode.com"; // Ou "https://rpc.sepolia.org" ou votre clé Infura/Alchemy
                provider = new ethers.providers.JsonRpcProvider(publicRPC);
                contractInstance = new ethers.Contract(contractAddress, contractABI, provider);
                
                statusText.innerText = "Connecté : RPC Public (Sepolia)";
                statusBadge.classList.add("status-online");
                toast("Blockchain connectée via RPC Public", "info");
                
            } catch (error) {
                console.error("Erreur de connexion blockchain:", error);
                statusText.innerText = "Erreur de connexion";
                statusBadge.classList.add("status-offline");
                toast("Problème de connexion au réseau blockchain. " + error.message, "error");
            }
        }

        // --- Scanner QR ---
        let html5QrCode;
        function toggleQRScanner() {
            const container = document.getElementById('qr-reader-container');
            if (container.style.display === 'block') {
                stopQRScanner();
            } else {
                startQRScanner();
            }
        }

        function startQRScanner() {
            document.getElementById('qr-reader-container').style.display = 'block';
            html5QrCode = new Html5Qrcode("qr-reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            html5QrCode.start({ facingMode: "environment" }, config, (decodedText) => {
                // Analyse de l'URL du QR
                let matricule = decodedText;
                if (decodedText.includes('mat=')) {
                    const url = new URL(decodedText);
                    matricule = url.searchParams.get('mat');
                }
                document.getElementById('verifMat').value = matricule;
                stopQRScanner();
                toast("Matricule scanné : " + matricule, "success");
                verifierIntegrite();
            }).catch(err => {
                toast("Erreur caméra : " + err, "error");
                stopQRScanner();
            });
        }

        function stopQRScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('qr-reader-container').style.display = 'none';
                }).catch(err => console.error(err));
            } else {
                document.getElementById('qr-reader-container').style.display = 'none';
            }
        }

        // --- Logique de Vérification ---
        async function hashFile(file) {
            const buffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return '0x' + hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verifierIntegrite() {
            const mat = document.getElementById('verifMat').value.trim().toUpperCase();
            const file = document.getElementById('verifFile').files[0];
            const resultBox = document.getElementById('verifResult');
            const btn = document.getElementById('btnVerifier');

            if (!mat) return toast("Veuillez entrer un matricule", "error");
            if (!contractInstance) {
                toast("Blockchain non connectée. Tentative de reconnexion...", "warn");
                await initBlockchainConnection(); // Tente de reconnecter
                if (!contractInstance) return; // Si toujours pas connecté, arrête
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> VÉRIFICATION...';
                resultBox.innerHTML = '';

                // Interrogation Blockchain
                const data = await contractInstance.verifierDiplome(mat);

                if (!data.estValide) {
                    resultBox.innerHTML = `
                        <div class="result-card" style="border-left-color: var(--danger);">
                            <div class="result-header" style="color: var(--danger);">
                                <i class="fas fa-times-circle"></i> DIPLÔME NON TROUVÉ
                            </div>
                            <p>Aucun enregistrement blockchain ne correspond au matricule <strong>${mat}</strong>.</p>
                        </div>
                    `;
                    toast("Diplôme invalide ou non répertorié", "error");
                    return;
                }

                // Vérification du fichier si présent
                let fileMatch = true;
                let fileStatusHtml = '';
                
                if (file) {
                    const localHash = await hashFile(file);
                    fileMatch = localHash.toLowerCase() === data.documentHash.toLowerCase();
                    
                    fileStatusHtml = `
                        <div class="result-item">
                            <span class="result-label">Intégrité du Fichier</span>
                            <span class="result-value" style="color: ${fileMatch ? 'var(--success)' : 'var(--danger)'}">
                                <i class="fas ${fileMatch ? 'fa-check-double' : 'fa-warning'}"></i>
                                ${fileMatch ? 'Authenticité du document confirmée' : 'Le document a été modifié !'}
                            </span>
                        </div>
                    `;
                }

                const dateStr = new Date(data.dateEnregistrement.toNumber() * 1000).toLocaleDateString('fr-FR', {
                    day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                resultBox.innerHTML = `
                    <div class="result-card" style="border-left-color: ${fileMatch ? 'var(--success)' : 'var(--danger)'}">
                        <div class="result-header" style="color: ${fileMatch ? 'var(--success)' : 'var(--danger)'}">
                            <i class="fas ${fileMatch ? 'fa-certificate' : 'fa-triangle-exclamation'}"></i>
                            ${fileMatch ? 'DIPLÔME AUTHENTIFIÉ' : 'ALERTE : DISCORDANCE'}
                        </div>
                        <div class="result-item">
                            <span class="result-label">Étudiant</span>
                            <span class="result-value">${data.nomEtudiant}</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">Faculté / Filière</span>
                            <span class="result-value">${data.faculte} — ${data.filiere}</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">Date d'Ancrage</span>
                            <span class="result-value">${dateStr}</span>
                        </div>
                        ${fileStatusHtml}
                        <div class="result-item">
                            <span class="result-label">Empreinte Numérique (Hash)</span>
                            <div class="hash-value">${data.documentHash}</div>
                        </div>
                    </div>
                `;

                if (fileMatch) toast("Diplôme authentifié avec succès", "success");
                else toast("Attention : Le fichier ne correspond pas !", "error");

            } catch (error) {
                console.error("Erreur de vérification:", error);
                toast("Erreur lors de la vérification : " + error.message, "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-magnifying-glass"></i> VÉRIFIER L\'AUTHENTICITÉ';
            }
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            startClock();
            initBlockchainConnection();
            
            // Auto-fill from URL
            const urlParams = new URLSearchParams(window.location.search);
            const mat = urlParams.get('mat');
            if (mat) {
                document.getElementById('verifMat').value = mat;
                setTimeout(verifierIntegrite, 1500); // Délai pour s'assurer que la connexion blockchain est établie
            }
        });
    </script>
</body>
</html>
